services:
  api:
    depends_on:
      - db
    container_name: api
    build: .
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/app
  
  db:
    container_name: db
    image: postgres:18
    restart: always
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_postgres:/var/lib/postgresql
  
volumes:
  db_postgres:
